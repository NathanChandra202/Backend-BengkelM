paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register akun baru
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Nathan Chandra
                email:
                  type: string
                  example: nathan@example.com
                password:
                  type: string
                  example: "12345678"
                phone:
                  type: string
                  example: "08123456789"
                address:
                  type: string
                  example: Jl. Merdeka No. 1
      responses:
        "201":
          description: User berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User created successfully
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login dengan email & password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: nathan@example.com
                password:
                  type: string
                  example: "12345678"
      responses:
        "200":
          description: Login berhasil, returns JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/google:
    post:
      tags: [Auth]
      summary: Login dengan Google (Firebase ID Token)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: Firebase ID token dari Google Sign-In
                  example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "500":
          description: Google login gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get profil user yang sedang login
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Data profil user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Token tidak ada atau tidak valid

  /auth/profile:
    put:
      tags: [Auth]
      summary: Update profil user (name, phone, address)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Nathan Updated
                phone:
                  type: string
                  example: "08999999999"
                address:
                  type: string
                  example: Jl. Baru No. 5
      responses:
        "200":
          description: Profil berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Profile updated
                  user:
                    $ref: "#/components/schemas/User"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request OTP untuk reset password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: nathan@example.com
      responses:
        "200":
          description: OTP berhasil dikirim ke email
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Kode OTP telah dikirim ke email kamu
        "404":
          description: Email tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password menggunakan OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email:
                  type: string
                  example: nathan@example.com
                otp:
                  type: string
                  example: "123456"
                newPassword:
                  type: string
                  example: newpassword123
      responses:
        "200":
          description: Password berhasil diubah
        "400":
          description: OTP salah atau sudah expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
